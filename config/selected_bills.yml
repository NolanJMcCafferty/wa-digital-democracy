# Operator-edited list of bills the daily batch (`wa-dd build-bundles`)
# rebuilds. Each entry is the same shape as `selected_demo.yml`. Workflow:
#
#   1. Run `wa-dd find-candidates --issue housing` (or another issue).
#   2. Open `data/processed/candidates.json` and pick 5–10 with TVW captions.
#   3. Paste each candidate's IDs as a new entry below.
#   4. Run `make daily-bundles` (or wait for cron).
