name: Agent Issue Quality

on:
  issues:
    types:
      - opened
      - edited
      - reopened
      - labeled
      - unlabeled

permissions:
  issues: write

jobs:
  validate:
    name: Validate autonomous issue spec
    runs-on: ubuntu-latest
    steps:
      - name: Check issue structure
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const body = issue.body || "";
            const labels = issue.labels.map((label) => label.name);
            const hasAgentReady = labels.includes("agent-ready");
            const qualityMarker = "<!-- agent-issue-quality -->";

            const managedLabels = [
              {
                name: "agent-candidate",
                color: "0366d6",
                description: "May be refined into autonomous agent work.",
              },
              {
                name: "needs-refinement",
                color: "d93f0b",
                description: "Missing scope, acceptance criteria, or validation.",
              },
              {
                name: "agent-ready",
                color: "0e8a16",
                description: "Spec is complete enough for autonomous implementation.",
              },
              {
                name: "agent-blocked",
                color: "b60205",
                description: "Agent should stop and wait for human input.",
              },
              {
                name: "human-review",
                color: "fbca04",
                description: "Implementation needs explicit human judgment before merge.",
              },
              {
                name: "no-agent",
                color: "5319e7",
                description: "Not safe or appropriate for autonomous agent work.",
              },
            ];

            async function ensureLabel(label) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ owner, repo, ...label });
              }
            }

            for (const label of managedLabels) {
              await ensureLabel(label);
            }

            function sectionContent(name) {
              const pattern = new RegExp(`(^|\\n)#{2,3} +${name}\\s*\\n([\\s\\S]*?)(?=\\n#{2,3} +|$)`, "i");
              const match = body.match(pattern);
              return match ? match[2].trim() : "";
            }

            function isMeaningful(text) {
              if (!text) return false;
              const normalized = text
                .replace(/<!--[\s\S]*?-->/g, "")
                .replace(/```[\s\S]*?```/g, "")
                .replace(/[-*]\s*\[[ xX]\]/g, "")
                .replace(/[`*_>#-]/g, "")
                .trim()
                .toLowerCase();
              return normalized.length >= 12 && !/^(n\/a|na|none|tbd|todo|unknown)$/.test(normalized);
            }

            const requiredSections = [
              "Goal",
              "Context",
              "Scope",
              "Non-Goals",
              "Acceptance Criteria",
              "Validation",
              "Constraints",
            ];
            const failures = [];

            for (const section of requiredSections) {
              if (!isMeaningful(sectionContent(section))) {
                failures.push(`Missing meaningful \`${section}\` section.`);
              }
            }

            const acceptanceCriteria = sectionContent("Acceptance Criteria");
            const taskItems = acceptanceCriteria.match(/^\s*[-*]\s+\[[ xX]\]\s+\S.+$/gm) || [];
            if (taskItems.length === 0) {
              failures.push("Acceptance Criteria must use at least one Markdown task-list checkbox.");
            }

            const validation = sectionContent("Validation");
            const hasShellFence = /```(?:sh|shell|bash)\s*\n[\s\S]*?\n```/i.test(validation);
            const hasKnownCommand = /\b(go test|go vet|make|pnpm|npm|yarn|rg|scripts\/)\b/.test(validation);
            if (!hasShellFence || !hasKnownCommand) {
              failures.push("Validation must include a fenced shell command block with exact commands to run.");
            }

            const constraints = sectionContent("Constraints");
            if (!/Follow AGENTS\.md\./i.test(constraints)) {
              failures.push("Constraints must include `Follow AGENTS.md.`");
            }

            if (/paid|provider-backed|production credentials/i.test(body) === false) {
              failures.push("Issue must explicitly address production credentials or paid/provider-backed work in Constraints or Non-Goals.");
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const existingQualityComment = comments.find((comment) => comment.body?.includes(qualityMarker));

            if (failures.length > 0) {
              if (hasAgentReady) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issue.number,
                  name: "agent-ready",
                });
              }

              if (!labels.includes("needs-refinement")) {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issue.number,
                  labels: ["needs-refinement"],
                });
              }

              const commentBody = `${qualityMarker}
            This issue is not ready for autonomous implementation.

            Required fixes:
            ${failures.map((failure) => `- ${failure}`).join("\n")}

            Add \`agent-ready\` again after the issue has a complete, independently verifiable spec.`;

              if (existingQualityComment) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existingQualityComment.id,
                  body: commentBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body: commentBody,
                });
              }

              core.setFailed("Issue is missing required autonomous-agent specification fields.");
              return;
            }

            if (labels.includes("needs-refinement")) {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number: issue.number,
                name: "needs-refinement",
              });
            }

            if (existingQualityComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingQualityComment.id,
                body: `${qualityMarker}
            This issue now has the required autonomous-agent specification fields.`,
              });
            }
