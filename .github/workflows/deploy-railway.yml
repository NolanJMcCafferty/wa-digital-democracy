name: Deploy Railway

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    paths:
      - ".github/workflows/deploy-railway.yml"
      - "scripts/bootstrap-railway.mjs"
      - "railway.json"
      - "Dockerfile"
      - "infra/railway/config/postgis.railway.json"
      - "infra/railway/postgis/**"
      - "apps/web/**"
      - "cmd/**"
      - "internal/**"
      - "db/migrations/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Trigger Railway deployments after reconciling config"
        required: true
        default: true
        type: boolean

concurrency:
  group: railway-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Railway bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check bootstrap script syntax
        run: node --check scripts/bootstrap-railway.mjs

      - name: Validate Railway config JSON
        run: |
          jq . railway.json >/dev/null
          jq . apps/web/railway.json >/dev/null
          jq . infra/railway/config/postgis.railway.json >/dev/null
          jq . infra/railway/config/migrate.railway.json >/dev/null
          jq . infra/railway/config/daily.railway.json >/dev/null

      - name: Dry-run desired Railway topology
        run: node scripts/bootstrap-railway.mjs apply --dry-run

  deploy:
    name: Reconcile and deploy Railway
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN || secrets.RAILWAY_TOKEN }}
      RAILWAY_WORKSPACE_ID: ${{ vars.RAILWAY_WORKSPACE_ID }}
      RAILWAY_PROJECT_NAME: ${{ vars.RAILWAY_PROJECT_NAME }}
      RAILWAY_GITHUB_REPO: ${{ github.repository }}
      RAILWAY_PRODUCTION_BRANCH: main
      RAILWAY_STAGING_BRANCH: staging

      POSTGIS_PASSWORD: ${{ secrets.POSTGIS_PASSWORD }}
      POSTGIS_PASSWORD_PRODUCTION: ${{ secrets.POSTGIS_PASSWORD_PRODUCTION }}
      POSTGIS_PASSWORD_STAGING: ${{ secrets.POSTGIS_PASSWORD_STAGING }}

      WADD_INTERNAL_API_TOKEN: ${{ secrets.WADD_INTERNAL_API_TOKEN }}
      WADD_INTERNAL_API_TOKEN_PRODUCTION: ${{ secrets.WADD_INTERNAL_API_TOKEN_PRODUCTION }}
      WADD_INTERNAL_API_TOKEN_STAGING: ${{ secrets.WADD_INTERNAL_API_TOKEN_STAGING }}

      INVINTUS_EMBEDDER_KEY: ${{ secrets.INVINTUS_EMBEDDER_KEY }}
      INVINTUS_EMBEDDER_KEY_PRODUCTION: ${{ secrets.INVINTUS_EMBEDDER_KEY_PRODUCTION }}
      INVINTUS_EMBEDDER_KEY_STAGING: ${{ secrets.INVINTUS_EMBEDDER_KEY_STAGING }}
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      SOCRATA_APP_TOKEN_PRODUCTION: ${{ secrets.SOCRATA_APP_TOKEN_PRODUCTION }}
      SOCRATA_APP_TOKEN_STAGING: ${{ secrets.SOCRATA_APP_TOKEN_STAGING }}

      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_SECRET_KEY_PRODUCTION: ${{ secrets.CLERK_SECRET_KEY_PRODUCTION }}
      CLERK_SECRET_KEY_STAGING: ${{ secrets.CLERK_SECRET_KEY_STAGING }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PRODUCTION: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_PRODUCTION }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_STAGING: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_STAGING }}
      CLERK_JWT_ISSUER: ${{ secrets.CLERK_JWT_ISSUER }}
      CLERK_JWT_ISSUER_PRODUCTION: ${{ secrets.CLERK_JWT_ISSUER_PRODUCTION }}
      CLERK_JWT_ISSUER_STAGING: ${{ secrets.CLERK_JWT_ISSUER_STAGING }}
      CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
      CLERK_JWKS_URL_PRODUCTION: ${{ secrets.CLERK_JWKS_URL_PRODUCTION }}
      CLERK_JWKS_URL_STAGING: ${{ secrets.CLERK_JWKS_URL_STAGING }}

      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID || secrets.R2_ACCESS_KEY_ID }}
      S3_ACCESS_KEY_ID_PRODUCTION: ${{ secrets.S3_ACCESS_KEY_ID_PRODUCTION || secrets.R2_ACCESS_KEY_ID_PRODUCTION }}
      S3_ACCESS_KEY_ID_STAGING: ${{ secrets.S3_ACCESS_KEY_ID_STAGING || secrets.R2_ACCESS_KEY_ID_STAGING }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY || secrets.R2_SECRET_ACCESS_KEY }}
      S3_SECRET_ACCESS_KEY_PRODUCTION: ${{ secrets.S3_SECRET_ACCESS_KEY_PRODUCTION || secrets.R2_SECRET_ACCESS_KEY_PRODUCTION }}
      S3_SECRET_ACCESS_KEY_STAGING: ${{ secrets.S3_SECRET_ACCESS_KEY_STAGING || secrets.R2_SECRET_ACCESS_KEY_STAGING }}
      S3_BUCKET_RAW: ${{ vars.S3_BUCKET_RAW }}
      S3_BUCKET_RAW_PRODUCTION: ${{ vars.S3_BUCKET_RAW_PRODUCTION }}
      S3_BUCKET_RAW_STAGING: ${{ vars.S3_BUCKET_RAW_STAGING }}
      S3_PREFIX: ${{ vars.S3_PREFIX }}
      S3_PREFIX_PRODUCTION: ${{ vars.S3_PREFIX_PRODUCTION }}
      S3_PREFIX_STAGING: ${{ vars.S3_PREFIX_STAGING }}

      PRODUCTION_WEB_PUBLIC_URL: ${{ vars.PRODUCTION_WEB_PUBLIC_URL }}
      STAGING_WEB_PUBLIC_URL: ${{ vars.STAGING_WEB_PUBLIC_URL }}
      PRODUCTION_API_PUBLIC_URL: ${{ vars.PRODUCTION_API_PUBLIC_URL }}
      STAGING_API_PUBLIC_URL: ${{ vars.STAGING_API_PUBLIC_URL }}
      API_RAILWAY_SUBDOMAIN: ${{ vars.API_RAILWAY_SUBDOMAIN }}
      WEB_RAILWAY_SUBDOMAIN: ${{ vars.WEB_RAILWAY_SUBDOMAIN }}
      PRODUCTION_API_RAILWAY_SUBDOMAIN: ${{ vars.PRODUCTION_API_RAILWAY_SUBDOMAIN }}
      PRODUCTION_WEB_RAILWAY_SUBDOMAIN: ${{ vars.PRODUCTION_WEB_RAILWAY_SUBDOMAIN }}
      STAGING_API_RAILWAY_SUBDOMAIN: ${{ vars.STAGING_API_RAILWAY_SUBDOMAIN }}
      STAGING_WEB_RAILWAY_SUBDOMAIN: ${{ vars.STAGING_WEB_RAILWAY_SUBDOMAIN }}
      PRODUCTION_WEB_CUSTOM_DOMAIN: ${{ vars.PRODUCTION_WEB_CUSTOM_DOMAIN }}
      STAGING_WEB_CUSTOM_DOMAIN: ${{ vars.STAGING_WEB_CUSTOM_DOMAIN }}
      PRODUCTION_API_CUSTOM_DOMAIN: ${{ vars.PRODUCTION_API_CUSTOM_DOMAIN }}
      STAGING_API_CUSTOM_DOMAIN: ${{ vars.STAGING_API_CUSTOM_DOMAIN }}

      DAILY_BIENNIUM: ${{ vars.DAILY_BIENNIUM }}
      DAILY_CRON: ${{ vars.DAILY_CRON }}
      WADD_ADMIN_JWT_AUDIENCE: ${{ vars.WADD_ADMIN_JWT_AUDIENCE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Reconcile Railway project, environments, services, variables, and domains
        run: |
          if [ -z "${RAILWAY_API_TOKEN:-}" ]; then
            echo "Missing RAILWAY_API_TOKEN or RAILWAY_TOKEN repository secret" >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy }}" != "true" ]; then
            node scripts/bootstrap-railway.mjs apply --skip-deploy
          else
            node scripts/bootstrap-railway.mjs apply --deploy
          fi
