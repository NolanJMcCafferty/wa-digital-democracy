version: "2"
sql:
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "queries"
        out: "internal/storage/db/queries"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "speaker_confidence"
            go_type: "string"
          - db_type: "org_match_confidence"
            go_type: "string"
          - db_type: "testifier_position"
            go_type: "string"
