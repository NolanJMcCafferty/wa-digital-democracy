# Local development stack for WA Digital Democracy.
# Per Recommended Tech Stack §"Deployment recommendation": Docker Compose
# locally; managed Postgres + container hosting in production.
#
# Bring up full stack (Postgres + migrations + API + web):
#
#   docker compose -f infra/docker-compose.yml up -d --build
#
# Stop:        docker compose -f infra/docker-compose.yml down
# Wipe data:   docker compose -f infra/docker-compose.yml down -v
#
# Bring up Postgres only:
#
#   docker compose -f infra/docker-compose.yml up -d postgres
#
# Bring up optional local BI/analytics tooling:
#
#   docker compose -f infra/docker-compose.yml --profile analytics up -d metabase

services:
  postgres:
    image: postgis/postgis:16-3.5-alpine
    container_name: wa-dd-postgres
    environment:
      POSTGRES_USER: wadd
      POSTGRES_PASSWORD: wadd
      POSTGRES_DB: wa_dd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wadd -d wa_dd"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ..
      target: migrate
    container_name: wa-dd-migrate
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - env/migrate.env
    restart: "no"

  api:
    build:
      context: ..
      target: api
    container_name: wa-dd-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - env/api.env
      - ../.env
    ports:
      - "8080:8080"

  web:
    build:
      context: ../apps/web
    container_name: wa-dd-web
    depends_on:
      - api
    env_file:
      - env/web.env
      - ../.env
    ports:
      - "3000:3000"

  metabase:
    image: metabase/metabase:v0.60.x
    container_name: wa-dd-metabase
    profiles: ["analytics"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Use the same local Postgres instance for Metabase application metadata.
      # For this prototype/dev stack, Metabase creates its own schema in wa_dd.
      # Do not use this layout for production.
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: wa_dd
      MB_DB_PORT: 5432
      MB_DB_USER: wadd
      MB_DB_PASS: wadd
      MB_DB_HOST: postgres
      MB_DB_SCHEMA: metabase
      JAVA_TIMEZONE: America/Los_Angeles
    ports:
      - "3001:3000"
    volumes:
      - metabase_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  metabase_plugins:
